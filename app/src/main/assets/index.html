<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ريسيفر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--ac:#ffc400;--mu:#9fb4d6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.hide{display:none!important}
#info{position:fixed;left:3%;right:3%;bottom:4%;background:linear-gradient(#123f86,#0b2a5c);border:2px solid #4f7fc9;border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:20px;box-shadow:0 8px 30px #000a}
#iNum{font-size:3rem;font-weight:700;color:var(--ac);min-width:110px;text-align:center}
#iLogo{width:70px;height:70px;object-fit:contain;background:#0006;border-radius:8px}
.meta{flex:1}
#iName{font-size:1.9rem;font-weight:700}
#iGrp{color:var(--mu);margin-top:4px}
#clock{font-size:1.5rem}
#list{position:fixed;top:5%;bottom:5%;right:3%;width:42%;display:flex;flex-direction:column;background:linear-gradient(#0b2a5c,#050b1a);border:2px solid #4f7fc9;border-radius:14px;box-shadow:0 10px 40px #000c}
.ph{padding:12px 18px;background:#123f86;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700}
.ph small{color:var(--ac);font-size:.95rem}
#rows{flex:1;overflow:hidden;padding:6px}
.row{display:flex;gap:14px;align-items:center;padding:9px 14px;border-radius:8px;font-size:1.2rem;white-space:nowrap}
.row .n{color:var(--ac);min-width:56px;text-align:center;font-weight:700}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.row.sel{background:var(--ac);color:#000}
.row.sel .n{color:#000}
#vol{position:fixed;top:6%;right:5%;background:#0b2a5ccc;border:2px solid #4f7fc9;padding:10px 20px;border-radius:12px;font-size:1.4rem;min-width:240px}
#vol div{height:10px;background:#fff3;border-radius:5px;margin-top:8px}
#vol i{display:block;height:100%;background:var(--ac);border-radius:5px}
#toast{position:fixed;top:45%;left:50%;transform:translateX(-50%);background:#000c;border:2px solid var(--ac);padding:16px 30px;border-radius:12px;font-size:1.5rem}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="info" class="hide"><div id="iNum"></div><img id="iLogo" alt=""><div class="meta"><div id="iName"></div><div id="iGrp"></div></div><div id="clock"></div></div>
<div id="list" class="hide"><div class="ph"><span id="lGrp"></span><small>◄ ► المجموعة · OK تشغيل</small></div><div id="rows"></div></div>
<div id="vol" class="hide">الصوت <span id="vn"></span><div><i id="vb"></i></div></div>
<div id="toast" class="hide"></div>

<script>
/* ===== ضع قائمة القنوات هنا (بصيغة M3U) بين علامتي ` ` ===== */
var M3U = `#EXTM3U
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC 1 (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-1/15cf99af5de54063fdabfefe66adc075/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC 4 (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-4/24f134f1cd63db9346439e96b86ca6ed/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC 5 (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-5/ee6b000cee0629411b666ab26cb13e9b/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Bollywood (1080p) [Geo-blocked]
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-bollywood/546eb40d7dcf9a209255dd2496903764/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Drama (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-drama/2c28a458e2f3253e678b07ac7d13fe71/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC FM (1080p)
https://dbbv9umqcd7cs.cloudfront.net/out/v1/db15b75c3cc0400c91961468d6a232ac/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Persia (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-persia/818ee8e4b592dc497608f066d825bfb4/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Masr (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-masr/956eac069c78a35d47245db6cdbb1575/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Masr 2 (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-masr-2/754931856515075b0aabf0e583495c68/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Iraq (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Masr Drama (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-masr-drama/567b703c19ede6598222de81b0e4508b/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC Mood (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-mood/78367bf48ccdba501d0d014a10c21031/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC+ Drama (1080p)
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-plus-drama/e37251ec2aac8f6c98f75cd0fa37cd28/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="MBC",MBC 3 USA (1080p) [Geo-blocked]
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-3-usa/5d58265a862a476dc7f97694addb5ded/index.m3u8
#EXTINF:-1 tvg-logo="" group-title="مصر - GENERAL",MBC 1 Egypt
https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-1-na/eec141533c90dd34722c503a296dd0d8/index.m3u8
`;
/* ============================================================ */

(function(){
var $=function(i){return document.getElementById(i)};
var v=$('v'),hls=null,ch=[],groups=['كل القنوات'],gi=0,view=[],cur=0,sel=0,open=false,vol=1,T={};
function tm(k,f,ms){clearTimeout(T[k]);T[k]=setTimeout(f,ms)}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hide');tm('t',function(){e.classList.add('hide')},2500)}

/* parse */
var m=null,L=M3U.split(/\r?\n/);
L.forEach(function(l){
  l=l.trim();if(!l)return;
  if(l.indexOf('#EXTINF')===0){
    var lg=/tvg-logo="([^"]*)"/.exec(l),g=/group-title="([^"]*)"/.exec(l);
    m={name:l.substring(l.lastIndexOf(',')+1).trim()||'قناة',logo:lg?lg[1]:'',group:g&&g[1]?g[1]:'أخرى'};
  }else if(l[0]!=='#'){
    ch.push({name:m?m.name:'قناة '+(ch.length+1),logo:m?m.logo:'',group:m?m.group:'أخرى',url:l});m=null;
  }
});
var s={};ch.forEach(function(c){s[c.group]=1});
groups=groups.concat(Object.keys(s));

function applyGroup(){
  var g=groups[gi];
  view=ch.map(function(c,i){return{c:c,i:i}}).filter(function(o){return gi===0||o.c.group===g});
  $('lGrp').textContent=g+' ('+view.length+')';
}
function play(i){
  if(!ch.length)return;
  cur=(i+ch.length)%ch.length;var c=ch[cur];
  if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|hls/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal)toast('تعذر تشغيل القناة')});
  }else v.src=c.url;
  v.play().catch(function(){});
  try{localStorage.setItem('last',cur)}catch(e){}
  showInfo();
}
function showInfo(){
  var c=ch[cur];if(!c)return;
  $('iNum').textContent=cur+1;$('iName').textContent=c.name;$('iGrp').textContent=c.group;
  var l=$('iLogo');if(c.logo){l.src=c.logo;l.style.visibility='visible'}else l.style.visibility='hidden';
  $('info').classList.remove('hide');tm('i',function(){$('info').classList.add('hide')},4000);
}
setInterval(function(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)},1000);

function drawList(){
  var vis=11,st=Math.max(0,Math.min(sel-5,view.length-vis)),h='';
  for(var k=st;k<Math.min(view.length,st+vis);k++){
    var o=view[k];
    h+='<div class="row'+(k===sel?' sel':'')+'"><span class="n">'+(o.i+1)+'</span><span class="t">'+esc(o.c.name)+'</span></div>';
  }
  $('rows').innerHTML=h;
}
function openList(){
  open=true;gi=0;applyGroup();
  var p=view.findIndex(function(o){return o.i===cur});sel=p<0?0:p;
  drawList();$('list').classList.remove('hide');
  tm('l',closeList,12000);
}
function closeList(){open=false;$('list').classList.add('hide')}
function setVol(d){
  vol=Math.max(0,Math.min(1,vol+d));v.volume=vol;
  $('vn').textContent=Math.round(vol*100);$('vb').style.width=vol*100+'%';
  $('vol').classList.remove('hide');tm('v',function(){$('vol').classList.add('hide')},1500);
}

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(open){
    tm('l',closeList,12000);
    if(k==='ArrowDown')sel=Math.min(view.length-1,sel+1);
    else if(k==='ArrowUp')sel=Math.max(0,sel-1);
    else if(k==='ArrowLeft'){gi=(gi+1)%groups.length;applyGroup();sel=0}
    else if(k==='ArrowRight'){gi=(gi-1+groups.length)%groups.length;applyGroup();sel=0}
    else if(k==='Enter'){if(view[sel])play(view[sel].i);closeList();e.preventDefault();return}
    else if(k==='Escape'||k==='Backspace'||k==='GoBack'){closeList()}
    drawList();e.preventDefault();return;
  }
  if(k==='ArrowUp')play(cur+1);
  else if(k==='ArrowDown')play(cur-1);
  else if(k==='ArrowRight')setVol(-0.05);
  else if(k==='ArrowLeft')setVol(0.05);
  else if(k==='Enter')openList();
  else return;
  e.preventDefault();
});

if(!ch.length)toast('لا توجد قنوات في الملف');
else{var l=0;try{l=parseInt(localStorage.getItem('last')||'0',10)||0}catch(e){}play(l<ch.length?l:0)}
})();
</script>
</body>
</html>
