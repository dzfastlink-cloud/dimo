<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وصلة TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--ac:#ffc400;--mu:#9fb4d6;--sf:3%}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden;user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.hide{display:none!important}
#blk{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#blk img{width:84px;height:84px}
#blk b{margin-top:4px;font-size:1rem;color:var(--mu)}
#blk small{font-size:.75rem;color:#5d7396}
.spin{width:30px;height:30px;margin-top:8px;border:3px solid #ffffff22;border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#blkMsg{font-size:.82rem;color:var(--ac);min-height:1.2em}
#numBox{z-index:15;position:fixed;top:calc(var(--sf) + 3%);left:calc(var(--sf) + 3%);background:linear-gradient(#123f86,#0b2a5c);border:2px solid var(--ac);border-radius:14px;padding:12px 22px;min-width:160px;box-shadow:0 8px 30px #000c;text-align:center}
#numVal{font-size:2.6rem;font-weight:700;color:var(--ac);line-height:1.1;direction:ltr}
#numName{font-size:.9rem;color:#dce8ff;margin-top:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info{z-index:10;position:fixed;left:calc(var(--sf) + .5%);right:calc(var(--sf) + .5%);bottom:calc(var(--sf) + 2%);background:linear-gradient(#123f86,#0b2a5c);border:2px solid #4f7fc9;border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:20px;box-shadow:0 8px 30px #000a}
#iNum{font-size:3rem;font-weight:700;color:var(--ac);min-width:110px;text-align:center}
#iLogo{width:70px;height:70px;object-fit:contain;background:#0006;border-radius:8px}
.meta{flex:1;min-width:0}
#iName{font-size:1.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#iGrp{color:var(--mu);margin-top:4px}
#clock{font-size:1.5rem}
.qacts{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.qbtn{background:#ffffff18;border:1px solid #4f7fc988;color:#dce8ff;border-radius:8px;padding:3px 10px;font-size:.75rem;cursor:pointer}
.qbtn:hover{background:var(--ac);color:#000;border-color:var(--ac)}
.panel{z-index:10;position:fixed;background:linear-gradient(#0b2a5c,#050b1a);border:2px solid #4f7fc9;border-radius:14px;box-shadow:0 10px 40px #000c}
#list{top:calc(var(--sf) + 2%);bottom:calc(var(--sf) + 2%);right:calc(var(--sf) + .5%);width:46%;min-width:320px;display:flex;flex-direction:column}
.ph{padding:12px 18px;background:#123f86;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.25rem;font-weight:700}
.ph small{color:var(--ac);font-size:.88rem;white-space:nowrap}
#lTabs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #4f7fc955;background:#071a3c}
#lTabs::-webkit-scrollbar{display:none}
.ltab{flex:none;padding:5px 12px;border-radius:999px;background:#ffffff12;color:#c5d4ee;font-size:.88rem;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.ltab.on{background:var(--ac);color:#000;font-weight:700}
#rows{flex:1;min-height:0;overflow:hidden;padding:6px}
.row{height:52px;display:flex;gap:10px;align-items:center;padding:0 12px;border-radius:8px;font-size:1.1rem;white-space:nowrap;cursor:pointer}
.row .n{color:var(--ac);min-width:48px;text-align:center;font-weight:700}
.row img,.row .lg{width:36px;height:36px;object-fit:contain;flex:none}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .fav{flex:none;font-size:1.15rem;padding:4px 6px;border-radius:6px;color:#7f97bf;cursor:pointer}
.row .fav.on{color:var(--ac)}
.row.sel{background:var(--ac);color:#000}
.row.sel .n,.row.sel .fav{color:#000}
/* ===== الإعدادات ===== */
#set{inset:calc(var(--sf) + 1%) calc(var(--sf) + 2%);display:flex;flex-direction:row;overflow:hidden;background:linear-gradient(135deg,#0d2f66,#050b1a 70%)}
#sSide{width:27%;flex:none;min-height:0;display:flex;flex-direction:column;padding:12px 12px 8px;background:#040a18cc;border-left:1px solid #4f7fc966}
#sSide .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 10px;border-bottom:1px solid #4f7fc933;margin-bottom:8px}
#sLogo{width:38px;height:38px;object-fit:contain;border-radius:10px;background:#0006}
#sSide .brand b{display:block;font-size:1.25rem}
#sSide .brand small{color:var(--ac);font-size:.8rem}
#sTabs{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.tab{flex:1 1 0;min-height:30px;max-height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;font-size:1.12rem;color:#c5d4ee;white-space:nowrap;border:2px solid transparent;cursor:pointer}
.tab .ti{width:30px;text-align:center;font-size:1.25rem}
.tab.on{background:#123f86;color:#fff;font-weight:700;border-color:#4f7fc9;box-shadow:inset -5px 0 0 var(--ac)}
#sTabs.sub .tab:not(.on){opacity:.45}
#sVer{color:#5d7396;font-size:.75rem;text-align:center;padding-top:8px}
#sContent{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#set .ph{flex:none;padding:9px 16px;font-size:1.15rem;border-radius:0;background:linear-gradient(90deg,#0b2a5c,#123f86);border-bottom:1px solid #4f7fc9aa}
#sT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sT em{font-style:normal;color:var(--mu);font-weight:400}
#sMain{flex:1;min-height:0;padding:10px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
#sBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
#sBody.scr{padding-left:14px}
.it{flex:none;height:var(--rh,54px);display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;background:#ffffff0a;border:2px solid #4f7fc933;font-size:1.12rem;white-space:nowrap;cursor:pointer}
.it .ic{width:calc(var(--rh,54px) - 18px);height:calc(var(--rh,54px) - 18px);flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#ffffff14;font-size:1.05rem;font-style:normal}
.it .no{min-width:34px;text-align:center;color:var(--ac);font-weight:700}
.it .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.it .mt{color:var(--mu);font-size:.9rem;flex:none}
.it .vl{flex:none;padding:4px 16px;border-radius:999px;background:#0b2a5c;border:1px solid #4f7fc9;color:var(--ac);font-weight:700;font-size:1rem}
.it .bd{flex:none;padding:3px 14px;border-radius:999px;font-size:.88rem;font-weight:700}
.it .bd.on{background:#1b5e3a;color:#8dffb8}
.it .bd.off{background:#5e1b1b;color:#ff9d9d}
.it.hid .lb{opacity:.55;text-decoration:line-through}
.it.dng .ic{background:#7a2323}
.it.cnf{border-color:#ff6b6b;background:#5e1b1b}
.it.sel{background:var(--ac);color:#000;border-color:#fff;box-shadow:0 0 0 3px #ffc40066}
.it.sel .no,.it.sel .mt{color:#000}
.it.sel .ic{background:#00000026}
.it.sel .vl{background:#000;color:var(--ac);border-color:#000}
.it.sel .bd.on{background:#0d4a2b;color:#b6ffd1}
.it.sel .bd.off{background:#6b1111;color:#ffc9c9}
.it.sel.cnf{background:#ff6b6b}
.trk{position:absolute;left:0;top:4px;bottom:4px;width:6px;border-radius:3px;background:#ffffff14}
.trk i{position:absolute;left:0;right:0;border-radius:3px;background:var(--ac)}
#sInf{flex:none;color:var(--mu);line-height:1.5;font-size:.85rem;max-height:3.6em;overflow:hidden;padding:6px 12px;border-radius:10px;background:#ffffff08;border:1px dashed #4f7fc955}
#sInf:empty{display:none}
#sInf a{direction:ltr;unicode-bidi:embed;color:#fff}
.pf{flex:none;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:7px 16px;color:var(--mu);font-size:.85rem;border-top:1px solid #4f7fc955;background:#040a1899}
.pf .kc{display:inline-flex;align-items:center;gap:6px}
.pf kbd{font-family:inherit;font-size:.78rem;font-weight:700;color:#000;background:var(--mu);padding:1px 9px;border-radius:6px}
#jmp{inset:calc(var(--sf) + 6%) 18%}
#jmp .body{padding:22px}
#jBody{display:flex;flex-direction:column;gap:10px}
.hintS{font-size:.7rem;color:#7f97bf;margin-top:6px;white-space:nowrap}
.btn{background:#0b2a5c;border:3px solid transparent;border-radius:10px;padding:13px 16px;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.btn.sel{border-color:var(--ac);background:#123f86}
#prm{z-index:25;inset:25% 18% auto;padding:0;overflow:hidden}
#prm .body{padding:20px;display:flex;flex-direction:column;gap:12px}
#prm input{width:100%;padding:12px 14px;border-radius:10px;border:2px solid #4f7fc9;background:#040a18;color:#fff;font-size:1.05rem;direction:ltr;outline:none}
#prm input:focus{border-color:var(--ac)}
.pacts{display:flex;gap:10px;justify-content:flex-end}
.pbtn{padding:10px 22px;border-radius:10px;border:2px solid #4f7fc9;background:#123f86;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.pbtn.ok{background:var(--ac);color:#000;border-color:var(--ac)}
#toast{z-index:30;position:fixed;top:45%;left:50%;transform:translateX(-50%);background:#000c;border:2px solid var(--ac);padding:16px 30px;border-radius:12px;font-size:1.5rem;text-align:center}
@media(max-width:720px){
  #list{width:auto;left:calc(var(--sf) + .5%);right:calc(var(--sf) + .5%)}
  #set{flex-direction:column}
  #sSide{width:auto;border-left:none;border-bottom:1px solid #4f7fc966;padding:8px}
  #sTabs{flex-direction:row;overflow-x:auto}
  .tab{flex:none;padding:6px 10px;font-size:.92rem}
  #prm{inset:20% 6% auto}
  #jmp{inset:calc(var(--sf) + 4%) 6%}
}
</style>
</head>

function start(){
  var c=ch[cur];if(!c)return;
  sleepStopped=false;hlsNetRt=0;hlsMedRt=0;
  setBlkState('جارٍ الاتصال...',true);
  if(hls){hls.destroy();hls=null}
  if(useExo()){try{v.pause()}catch(e){}Android.play(c.url);tm('stall',fail,20000);return}
  if(window.Android&&Android.stop)Android.stop();
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|hls/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,function(e,d){
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&hlsNetRt<1){hlsNetRt++;setBlkState('إعادة الاتصال بالشبكة...',true);hls.startLoad();return}
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&hlsMedRt<1){hlsMedRt++;setBlkState('استعادة البث...',true);hls.recoverMediaError();return}
      fail();
    });
  }else v.src=c.url;
  v.play().catch(function(){});
  tm('stall',fail,15000);
}
function fail(){
  clearTimeout(T.stall);
  if(rt<P.maxRt){rt++;setBlkState('إعادة المحاولة ('+rt+'/'+P.maxRt+')...',true);tm('rt',start,1200);return}
  if(P.autoNext&&sk<5){sk++;toast('القناة لا تعمل — الانتقال للتالية');tm('rt',function(){play(cur+1)},900);return}
  setBlkState('القناة لا تعمل — ▲ للقناة التالية',false);
  toast('القناة لا تعمل — ▲ للقناة التالية');
}
function play(i,noPrev){
  if(!ch.length)return;
  var next=(i+ch.length)%ch.length;
  if(!noPrev&&cur!==next&&ch[cur])prevCur=cur;
  cur=next;rt=0;
  store('lasturl',ch[cur].url);start();showInfo();
}
function onPlay(){clearTimeout(T.stall);rt=0;sk=0;hlsNetRt=0;hlsMedRt=0;$('blk').classList.add('hide')}
v.addEventListener('playing',onPlay);
window.onPlayer=function(ev){if(ev==='playing')onPlay();else if(ev==='error')fail()};
v.addEventListener('error',function(){fail()});
function showInfo(){
  var c=ch[cur];if(!c)return;
  $('iNum').textContent=cur+1;$('iName').textContent=(favs[c.url]?'★ ':'')+c.name;$('iGrp').textContent=c.group;
  var l=$('iLogo');if(c.logo){l.src=c.logo;l.style.visibility='visible'}else l.style.visibility='hidden';
  $('info').classList.remove('hide');if(P.infoMs>0)tm('i',function(){$('info').classList.add('hide')},P.infoMs);else clearTimeout(T.i);
}
setInterval(function(){
  var d=new Date();
  $('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(sleepEnd>0&&Date.now()>=sleepEnd){
    sleepEnd=0;sleepMin=0;sleepStopped=true;
    if(hls){hls.destroy();hls=null}
    try{v.pause()}catch(e){}
    if(window.Android&&Android.stop)Android.stop();
    setBlkState('تم إيقاف التشغيل (مؤقت النوم) — اضغط للعودة',false);
    closeAll();
  }
},1000);

/* الترقيم السريع */
function showNum(){
  var n=parseInt(numBuf,10),c=n>=1&&n<=ch.length?ch[n-1]:null;
  $('numVal').textContent=numBuf;
  $('numName').textContent=c?c.name:'غير موجود ('+ch.length+' قناة)';
  $('numBox').classList.remove('hide');
}
function clearNum(){clearTimeout(T.num);numBuf='';$('numBox').classList.add('hide')}
function commitNum(){
  var n=parseInt(numBuf,10);clearNum();
  if(n>=1&&n<=ch.length){sk=0;play(n-1)}
  else toast('القناة '+n+' غير موجودة');
}

/* قائمة القنوات */
function drawList(){
  $('lTabs').innerHTML=groups.map(function(g,k){
    return'<div class="ltab'+(k===gi?' on':'')+'" data-g="'+k+'">'+esc(g)+'</div>';
  }).join('');
  var on=$('lTabs').querySelector('.on');
  if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
  var R=$('rows'),vis=Math.max(3,Math.floor((R.clientHeight-12)/52));
  sel=view.length?Math.max(0,Math.min(sel,view.length-1)):0;
  var st=Math.max(0,Math.min(sel-Math.floor(vis/2),view.length-vis)),h='';
  for(var k=st;k<Math.min(view.length,st+vis);k++){
    var o=view[k],fv=!!favs[o.c.url];
    h+='<div class="row'+(k===sel?' sel':'')+'" data-i="'+k+'"><span class="n">'+(o.i+1)+'</span>'+
       (o.c.logo?'<img src="'+esc(o.c.logo)+'" onerror="this.style.visibility=\'hidden\'">':'<span class="lg"></span>')+
       '<span class="t">'+esc(o.c.name)+'</span>'+
       '<span class="fav'+(fv?' on':'')+'" data-f="'+k+'">'+(fv?'★':'☆')+'</span></div>';
  }
  R.innerHTML=h||'<div style="padding:20px;text-align:center;color:var(--mu)">لا توجد قنوات في هذه المجموعة</div>';
}
function openList(){
  mode='list';gi=0;applyGroup();
  var p=view.findIndex(function(o){return o.i===cur});sel=p<0?0:p;
  $('list').classList.remove('hide');drawList();tm('l',closeAll,12000);
}
function closeAll(){clearTimeout(T.l);mode='play';$('list').classList.add('hide');$('set').classList.add('hide');$('jmp').classList.add('hide');$('prm').classList.add('hide')}

/* الإعدادات */
var srcs=[],sm='main',cf=0,cc=0,gc=0,conf=false,wk=null,VER='1.6',svis=8,lastBk=0;
function backOnce(){var n=Date.now();if(n-lastBk<150)return;lastBk=n;back()}
var CATS=['المصادر','القنوات','العرض','التشغيل','نسخ احتياطي','حول'];
function savePrefs(){store('prefs',JSON.stringify(P))}
function applyPrefs(){
  var n=useExo();
  v.style.objectFit=P.ar;v.style.display=n?'none':'';
  document.documentElement.style.setProperty('--sf',(P.safe||0)+'%');document.documentElement.style.background=n?'transparent':'#000';document.body.style.background=n?'transparent':'#000';
  $('clock').style.display=P.clock?'':'none';$('iLogo').style.display=P.logo?'':'none';
  if(window.Android&&Android.setAspect)Android.setAspect(P.ar);
}
function loadPrefs(){try{var o=JSON.parse(store('prefs')||'{}');for(var k in o)if(k in P)P[k]=o[k]}catch(e){}applyPrefs()}
function saveSrcs(){
  store('srcs',JSON.stringify(srcs.map(function(s){
    var o={id:s.id,name:s.name,enabled:s.enabled,hid:s.hid||[],del:s.del||[],ord:s.ord||[]};
    if(s.url)o.url=s.url;
    if(!defMap[s.id]||s.text!==defMap[s.id].text)o.text=s.text;
    return o;
  })));
}
function loadSrcs(){
  try{srcs=JSON.parse(store('srcs')||'null')}catch(e){srcs=null}
  if(!Array.isArray(srcs)){
    var old=store('m3u');
    srcs=old?[{id:1,name:'قائمتي',enabled:true,text:old}]:DEF.map(function(d){return{id:d.id,name:d.name,enabled:true,text:d.text}});
    saveSrcs();
  }else{
    srcs.forEach(function(s){if(s.text==null&&defMap[s.id])s.text=defMap[s.id].text});
    srcs=srcs.filter(function(s){return s.text!=null});
  }
}
function setOf(a){var o={};(a||[]).forEach(function(u){o[u]=1});return o}
function rebuild(){
  var seen={},all=[];
  srcs.forEach(function(s){
    var d=setOf(s.del),h=setOf(s.hid),a=parse(s.text).filter(function(c){return!d[c.url]});
    if(s.ord&&s.ord.length){
      var m={},p={};a.forEach(function(c){m[c.url]=c});s.ord.forEach(function(u){p[u]=1});
      a=s.ord.filter(function(u){return m[u]}).map(function(u){return m[u]}).concat(a.filter(function(c){return!p[c.url]}));
    }
    s.all=a;
    var vis=a.filter(function(c){return!h[c.url]});
    s.n=vis.length;s.start=all.length;s.cnt=0;
    if(s.enabled)vis.forEach(function(c){if(!seen[c.url]){seen[c.url]=1;all.push(c);s.cnt++}});
  });
  setChannels(all);
}
function keep(){
  var u=ch[cur]&&ch[cur].url;rebuild();
  var i=ch.findIndex(function(c){return c.url===u});
  if(i>=0)cur=i;
  else if(ch.length)play(0,true);
  else{if(hls){hls.destroy();hls=null}v.pause();if(window.Android&&Android.stop)Android.stop();setBlkState('لا توجد قنوات مفعّلة',false)}
}
function done(m,i){saveSrcs();keep();sm=m;si=Math.max(0,i);conf=false;drawSet()}
function openUrl(u){try{if(window.Android&&Android.openUrl)Android.openUrl(u);else window.open(u,'_blank')}catch(e){toast('تعذر فتح الرابط')}}
function back(){
  conf=false;
  if(sm==='move'){wk=null;sm='ch';si=cc}
  else if(sm==='chact'){sm='ch';si=cc}
  else if(sm==='ch'||sm==='grp'){sm='src';si=0}
  else if(sm==='grpact'){sm='grp';si=gc}
  else if(sm==='src'){sm='main';si=cf}
  else if(sm==='hid'){sm='main';si=1}
  else{closeAll();return}
  drawSet();
}
function endMove(){var s=srcs[cf];s.ord=wk.map(function(c){return c.url});wk=null;done('ch',cc)}
function grpList(s){var o=[],ix={};s.all.forEach(function(c){if(!(c.group in ix)){ix[c.group]=o.length;o.push({name:c.group,urls:[]})}o[ix[c.group]].urls.push(c.url)});return o}
function reorderGroups(s,G,from,to){var o=G.slice(),g=o.splice(from,1)[0];o.splice(to,0,g);s.ord=[].concat.apply([],o.map(function(x){return x.urls}))}
function hiddenList(){var o=[];srcs.forEach(function(s){var h=setOf(s.hid);(s.all||[]).forEach(function(c){if(h[c.url])o.push({s:s,c:c})})});return o}
function opt(label,key,vals,labs){
  var i=Math.max(0,vals.indexOf(P[key]));
  return{t:label+': '+labs[i],f:function(){P[key]=vals[(i+1)%vals.length];savePrefs();applyPrefs();drawSet()}};
}
function exportCfg(){
  var o={app:'wassla-tv',v:1,prefs:P,favs:Object.keys(favs),srcs:srcs.map(function(s){var r={id:s.id,name:s.name,enabled:s.enabled,hid:s.hid||[],del:s.del||[],ord:s.ord||[]};if(s.url)r.url=s.url;if(!defMap[s.id]||s.text!==defMap[s.id].text)r.text=s.text;return r})};
  var txt=JSON.stringify(o),name='wassla-tv-backup.json';
  try{
    if(window.Android&&Android.saveText){var p=Android.saveText(name,txt);toast(p?'تم الحفظ: '+p:'تعذر الحفظ');return}
    var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);a.download=name;a.click();toast('تم التصدير');
  }catch(e){toast('تعذر التصدير')}
}

/* إضافة/تحديث مصدر من رابط */
function openUrlModal(){
  mode='url';$('prmUrl').value='';$('prmName').value='';
  $('prm').classList.remove('hide');
  setTimeout(function(){$('prmUrl').focus()},50);
}
function closeUrlModal(){$('prm').classList.add('hide');mode='set';drawSet(true)}
function submitUrlModal(){
  var u=$('prmUrl').value.trim(),nm=$('prmName').value.trim();
  if(!/^https?:\/\//i.test(u)){toast('أدخل رابطاً يبدأ بـ http:// أو https://');return}
  toast('جارٍ تحميل القائمة...');
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(txt){
    var a=parse(txt);
    if(!a.length){toast('الرابط لا يحتوي على قنوات M3U صالحة');return}
    if(!nm){try{nm=new URL(u).hostname}catch(e){nm='مصدر رابط'}}
    srcs.push({id:Date.now(),name:nm,enabled:true,url:u,text:txt});
    saveSrcs();keep();$('prm').classList.add('hide');mode='set';sm='main';cat=0;si=srcs.length-1;drawSet();
    toast('تمت إضافة '+a.length+' قناة');
  }).catch(function(){toast('تعذر جلب الرابط (تحقق من الإنترنت أو CORS)')});
}
function refreshSrc(s){
  if(!s||!s.url)return;
  toast('جارٍ تحديث '+s.name+'...');
  fetch(s.url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(txt){
    var a=parse(txt);if(!a.length){toast('القائمة المحدّثة فارغة');return}
    s.text=txt;saveSrcs();keep();drawSet();toast('تم التحديث: '+a.length+' قناة');
  }).catch(function(){toast('تعذر تحديث المصدر')});
}

function catItems(){
  var it=[];
  if(cat===0){
    srcs.forEach(function(x,i){it.push({t:(i+1)+'. '+(x.enabled?'✔ ':'⛔ ')+x.name+' · '+x.n+' قناة',f:function(){cf=i;sm='src';si=0;conf=false;drawSet()}})});
    it.push({t:'➕ إضافة مصدر (ملف M3U / TXT)',f:function(){$('file').click()}});
    it.push({t:'🌐 إضافة مصدر عبر رابط (M3U URL)',f:openUrlModal});
    if(DEF.some(function(d){return!srcs.some(function(x){return x.id===d.id})}))it.push({t:'↺ استرجاع المصادر الافتراضية',f:function(){DEF.forEach(function(d){if(!srcs.some(function(x){return x.id===d.id}))srcs.push({id:d.id,name:d.name,enabled:true,text:d.text})});saveSrcs();keep();drawSet()}});
    return{title:'المصادر',list:it};
  }
  if(cat===1){
    var H=hiddenList();
    it.push({t:'القنوات الظاهرة الآن: '+ch.length,f:function(){}});
    it.push({t:'★ القنوات المفضلة: '+Object.keys(favs).length,f:function(){if(Object.keys(favs).length){closeAll();openList();gi=1;applyGroup();sel=0;drawList()}else toast('لا توجد قنوات مفضلة بعد')}});
    it.push({t:'👁 القنوات المخفية ('+H.length+')',f:function(){sm='hid';si=0;drawSet()}});
    it.push({t:conf?'⚠ اضغط OK مرة أخرى للتأكيد':'↺ إلغاء كل تعديلات القنوات',f:function(){if(!conf){conf=true;drawSet();return}srcs.forEach(function(s){s.hid=[];s.del=[];s.ord=[]});done('main',3)}});
    return{title:'القنوات',list:it};
  }
  if(cat===2){
    it.push(opt('هامش الشاشة الآمن','safe',[0,3,5,8],['بدون','صغير','متوسط','كبير']));
    it.push(opt('نسبة الصورة','ar',['contain','fill','cover'],['أصلية','ملء الشاشة','قص']));
    it.push(opt('مدة شريط المعلومات','infoMs',[3000,5000,8000,0],['3 ثوانٍ','5 ثوانٍ','8 ثوانٍ','دائم']));
    it.push(opt('إظهار الساعة','clock',[true,false],['نعم','لا']));
    it.push(opt('إظهار شعار القناة','logo',[true,false],['نعم','لا']));
    return{title:'العرض',list:it};
  }
  if(cat===3){
    if(window.Android&&Android.play)it.push({t:'المشغّل: '+(P.engine==='exo'?'ExoPlayer (أصلي)':'WebView'),f:function(){P.engine=P.engine==='exo'?'web':'exo';savePrefs();applyPrefs();rt=0;start();drawSet()}});
    it.push(opt('محاولات إعادة التشغيل','maxRt',[0,2,4],['بدون','مرتان','4 مرات']));
    it.push(opt('البدء على آخر قناة','resume',[true,false],['نعم','لا']));
    it.push(opt('الانتقال التلقائي عند التعطل','autoNext',[false,true],['لا','نعم']));
    var sv=[0,15,30,60,90,120],sl=['بدون','15 دقيقة','30 دقيقة','60 دقيقة','90 دقيقة','120 دقيقة'];
    var si2=Math.max(0,sv.indexOf(sleepMin));
    it.push({t:'مؤقت النوم: '+sl[si2],f:function(){
      sleepMin=sv[(si2+1)%sv.length];
      sleepEnd=sleepMin?Date.now()+sleepMin*60000:0;
      drawSet();
      toast(sleepMin?'سيتم الإيقاف بعد '+sleepMin+' دقيقة':'تم إلغاء مؤقت النوم');
    }});
    return{title:'التشغيل',list:it};
  }
  if(cat===4){
    it.push({t:'📤 تصدير الإعدادات إلى ملف',f:exportCfg});
    it.push({t:'📥 استيراد الإعدادات من ملف',f:function(){$('file2').click()}});
    return{title:'نسخ احتياطي',list:it};
  }
  it.push({t:'وصلة TV · dimo',f:function(){}});

  it.push({t:'🌐 https://dzfastlink.blogspot.com/',f:function(){openUrl('https://dzfastlink.blogspot.com/')}});
  return{title:'حول التطبيق',list:it};
}
function items(){
  var it=[],s=srcs[cf];
  if(sm==='main')return catItems();
  if(sm==='hid'){
    var H=hiddenList();
    H.forEach(function(o){it.push({t:o.c.name+' · '+o.s.name,f:function(){o.s.hid=(o.s.hid||[]).filter(function(u){return u!==o.c.url});saveSrcs();keep();si=Math.min(si,Math.max(0,H.length-2));drawSet()}})});
    if(!H.length)it.push({t:'لا توجد قنوات مخفية',f:back});
    return{title:'القنوات المخفية · OK لإظهار القناة',list:it};
  }
  if(sm==='src'){
    it.push({t:s.enabled?'⛔ إيقاف المصدر':'✔ تفعيل المصدر',f:function(){s.enabled=!s.enabled;done('main',cf)}});
    if(s.url)it.push({t:'↺ تحديث المصدر من الرابط',f:function(){refreshSrc(s)}});
    if(cf>0)it.push({t:'▲ تحريك المصدر للأعلى',f:function(){srcs.splice(cf,1);srcs.splice(cf-1,0,s);done('main',cf-1)}});
    if(cf<srcs.length-1)it.push({t:'▼ تحريك المصدر للأسفل',f:function(){srcs.splice(cf,1);srcs.splice(cf+1,0,s);done('main',cf+1)}});
    it.push({t:'✏ تعديل القنوات ('+s.all.length+')',f:function(){sm='ch';si=0;cc=0;drawSet()}});
    it.push({t:'🗂 المجموعات',f:function(){sm='grp';si=0;gc=0;drawSet()}});
    if((s.hid&&s.hid.length)||(s.del&&s.del.length)||(s.ord&&s.ord.length))it.push({t:'↺ إلغاء تعديلات القنوات',f:function(){s.hid=[];s.del=[];s.ord=[];done('src',0)}});
    it.push({t:conf?'⚠ اضغط OK مرة أخرى للتأكيد':'🗑 حذف المصدر',f:function(){if(!conf){conf=true;drawSet();return}srcs.splice(cf,1);done('main',Math.min(cf,srcs.length-1))}});
    it.push({t:'↩ رجوع',f:back});
    return{title:s.name,list:it};
  }
  if(sm==='ch'||sm==='move'){
    var A=sm==='move'?wk:s.all,hs=setOf(s.hid);
    A.forEach(function(c,i){it.push({t:(i+1)+'. '+(sm==='move'&&i===cc?'⇅ ':hs[c.url]?'🚫 ':'')+c.name,f:function(){
      if(sm==='move')endMove();else{cc=i;sm='chact';si=0;conf=false;drawSet()}}})});
    if(!A.length)it.push({t:'لا توجد قنوات',f:back});
    return{title:s.name+(sm==='move'?' · ▲▼ حرّك ثم OK':' · القنوات'),list:it};
  }
  if(sm==='chact'){
    var c=s.all[cc];if(!c){sm='ch';return items()}
    var hd=setOf(s.hid)[c.url],n=s.all.length;
    it.push({t:hd?'👁 إظهار القناة':'🚫 إخفاء القناة',f:function(){var h=(s.hid||[]).filter(function(u){return u!==c.url});s.hid=hd?h:h.concat([c.url]);done('ch',cc)}});
    it.push({t:'⇅ تحريك القناة',f:function(){wk=s.all.slice();sm='move';si=cc;drawSet()}});
    it.push({t:conf?'⚠ اضغط OK مرة أخرى للتأكيد':'🗑 حذف القناة نهائياً',f:function(){
      if(!conf){conf=true;drawSet();return}
      var ne=function(u){return u!==c.url};
      s.del=(s.del||[]).concat([c.url]);s.hid=(s.hid||[]).filter(ne);s.ord=(s.ord||[]).filter(ne);
      done('ch',Math.min(cc,Math.max(0,n-2)))}});
    it.push({t:'↩ رجوع',f:back});
    return{title:c.name,list:it};
  }
  if(sm==='grp'){
    var G=grpList(s),hs1=setOf(s.hid);
    G.forEach(function(g,i){var k2=g.urls.filter(function(u){return hs1[u]}).length;
      it.push({t:(i+1)+'. '+(k2===g.urls.length?'🚫 ':'')+g.name+' · '+g.urls.length+(k2&&k2<g.urls.length?' (مخفي '+k2+')':''),f:function(){gc=i;sm='grpact';si=0;conf=false;drawSet()}})});
    if(!G.length)it.push({t:'لا توجد مجموعات',f:back});
    return{title:s.name+' · المجموعات',list:it};
  }
  var G2=grpList(s),g=G2[gc];if(!g){sm='grp';return items()}
  var hs2=setOf(s.hid),allh=g.urls.every(function(u){return hs2[u]}),gs=setOf(g.urls),m2=G2.length;
  it.push({t:allh?'👁 إظهار المجموعة':'🚫 إخفاء المجموعة',f:function(){var h=(s.hid||[]).filter(function(u){return!gs[u]});s.hid=allh?h:h.concat(g.urls);done('grp',gc)}});
  if(gc>0)it.push({t:'▲ تحريك المجموعة للأعلى',f:function(){reorderGroups(s,G2,gc,gc-1);done('grp',gc-1)}});
  if(gc<m2-1)it.push({t:'▼ تحريك المجموعة للأسفل',f:function(){reorderGroups(s,G2,gc,gc+1);done('grp',gc+1)}});
  it.push({t:conf?'⚠ اضغط OK مرة أخرى للتأكيد':'🗑 حذف المجموعة نهائياً',f:function(){
    if(!conf){conf=true;drawSet();return}
    var ng=function(u){return!gs[u]};
    s.del=(s.del||[]).concat(g.urls);s.hid=(s.hid||[]).filter(ng);s.ord=(s.ord||[]).filter(ng);
    done('grp',Math.min(gc,Math.max(0,m2-2)))}});
  it.push({t:'↩ رجوع',f:back});
  return{title:g.name+' · '+g.urls.length+' قناة',list:it};
}
var CICON=['📡','📺','🖥','▶','💾','ℹ'];
function K(k,t){return'<span class="kc"><kbd>'+k+'</kbd>'+t+'</span>'}
function rowHTML(t,sel,idx){
  var cls='it'+(sel?' sel':''),m,ic='',no='',lb='',mt='',vl='',bd='';
  if(m=/^(\d+)\. (✔|⛔) (.+) · (\d+) قناة$/.exec(t)){
    no=m[1];lb=m[3];mt=m[4]+' قناة';bd=m[2]==='✔'?'<span class="bd on">مفعّل</span>':'<span class="bd off">متوقف</span>';
    return'<div class="'+cls+'" data-i="'+idx+'"><span class="no">'+no+'</span><span class="lb">'+esc(lb)+'</span><span class="mt">'+esc(mt)+'</span>'+bd+'</div>';
  }
  var s=t;
  if(m=/^(\d+)\. (.*)$/.exec(s)){no=m[1];s=m[2]}
  if(m=/^(⇅|🚫)\s+(.*)$/.exec(s)){ic=m[1];s=m[2];if(ic==='🚫')cls+=' hid'}
  else if(m=/^(✔|⛔|👁|➕|↺|📤|📥|▲|▼|✏|🗂|🗑|↩|⚠|🌐|★)\s*(.*)$/.exec(s)){ic=m[1];s=m[2]}
  if(ic==='🗑'||ic==='⚠')cls+=' dng';
  if(ic==='⚠')cls+=' cnf';
  if(sm==='main'&&(cat>=1&&cat<=3)&&(m=/^(.+?): (.+)$/.exec(s))){lb=m[1];vl=m[2]}
  else if(m=/^(.+) · (.+)$/.exec(s)){lb=m[1];mt=m[2]}
  else lb=s;
  return'<div class="'+cls+'" data-i="'+idx+'">'+(no?'<span class="no">'+no+'</span>':'')+(ic?'<i class="ic">'+ic+'</i>':'')+
    '<span class="lb">'+esc(lb)+'</span>'+(mt?'<span class="mt">'+esc(mt)+'</span>':'')+(vl?'<span class="vl">'+esc(vl)+'</span>':'')+'</div>';
}
function drawSet(keepList){
  if(!keepList||!curSet)curSet=items();
  var o=curSet,L=o.list,h='';
  var inf='';
  if(sm==='main'&&cat===0)inf='القنوات المفعّلة: '+ch.length+' · ترتيب المصادر = ترقيم القنوات';
  else if(sm==='ch')inf='🚫 = مخفية · OK على قناة لإخفائها أو تحريكها أو حذفها';
  else if(sm==='main'&&cat===4)inf='يُحفظ الملف في مجلد Download (وعلى الأجهزة القديمة في Android/data) · الاستيراد يستبدل مصادرك وتعديلاتك';
  else if(sm==='main'&&cat===5)inf='<div style="font-size:.6rem;opacity:.65;direction:ltr;text-align:center">Interface by Atallaoui Dahman</div>';
  $('sInf').innerHTML=inf;
  $('sFoot').innerHTML=sm==='main'?K('▲▼','تنقّل')+K('OK','اختيار')+K('◄ ►','الأقسام')+K('BACK','إغلاق')
    :sm==='move'?K('▲▼','حرّك القناة')+K('OK','تثبيت')+K('BACK','إلغاء')
    :(sm==='ch'||sm==='grp'||sm==='hid')?K('▲▼','تنقّل')+K('OK','اختيار')+K('◄ ►','صفحة')+K('BACK','رجوع')
    :K('▲▼','تنقّل')+K('OK','اختيار')+K('BACK','رجوع');
  var gap=6,bh=$('sBody').clientHeight,vis=8,rh=54;
  if(bh>60){vis=Math.max(3,Math.min(12,Math.floor((bh+gap)/(44+gap))));rh=Math.min(58,Math.floor((bh+gap)/vis)-gap)}
  svis=vis;$('sBody').style.setProperty('--rh',rh+'px');
  si=Math.max(0,Math.min(si,L.length-1));
  var st=Math.max(0,Math.min(si-Math.floor(vis/2),L.length-vis));
  for(var k=st;k<Math.min(L.length,st+vis);k++)h+=rowHTML(L[k].t,k===si,k);
  var scr=L.length>vis;
  if(scr){var th=vis/L.length*100,tp=st/L.length*100;h+='<div class="trk"><i style="top:'+tp+'%;height:'+th+'%"></i></div>'}
  $('sBody').className=scr?'scr':'';
  $('sBody').innerHTML=h;
  $('sTabs').className=sm==='main'?'':'sub';
  $('sTabs').innerHTML=CATS.map(function(n,i){return'<div class="tab'+(i===cat?' on':'')+'" data-c="'+i+'"><span class="ti">'+CICON[i]+'</span>'+n+'</div>'}).join('');
  $('sT').innerHTML=sm==='main'?esc(o.title):'<em>'+esc(CATS[cat])+' ›</em> '+esc(o.title);
  $('sCnt').textContent=L.length>1?(si+1)+' / '+L.length:'';
  var lg=$('sLogo');if(!lg.getAttribute('src')){var bi=document.querySelector('#blk img');if(bi)lg.src=bi.src}
  $('sVer').textContent='الإصدار '+VER;
}
function openSet(){mode='set';sm='main';cat=0;si=0;conf=false;$('set').classList.remove('hide');drawSet()}
$('file').onchange=function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var a=parse(r.result);
    if(!a.length){toast('الملف لا يحتوي على قنوات');return}
    srcs.push({id:Date.now(),name:f.name.replace(/\.[^.]+$/,''),enabled:true,text:r.result});
    saveSrcs();keep();sm='main';cat=0;si=srcs.length-1;drawSet();toast('تمت إضافة '+a.length+' قناة');
  };
  r.onerror=function(){toast('تعذر قراءة الملف')};r.readAsText(f);
};
$('file2').onchange=function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||o.app!=='wassla-tv'||!Array.isArray(o.srcs))throw 0;
      var ns=[];
      o.srcs.forEach(function(x){
        var text=x.text!=null?x.text:(defMap[x.id]?defMap[x.id].text:null);
        if(text!=null){
          var item={id:x.id,name:x.name,enabled:x.enabled!==false,text:text,hid:x.hid||[],del:x.del||[],ord:x.ord||[]};
          if(x.url)item.url=x.url;
          ns.push(item);
        }
      });
      if(!ns.length)throw 0;
      srcs=ns;if(o.prefs)for(var k in o.prefs)if(k in P)P[k]=o.prefs[k];
      if(Array.isArray(o.favs)){favs={};o.favs.forEach(function(u){favs[u]=1});saveFavs()}
      saveSrcs();savePrefs();applyPrefs();keep();sm='main';si=0;drawSet();toast('تم استيراد الإعدادات');
    }catch(err){toast('ملف النسخ الاحتياطي غير صالح')}
  };
  r.onerror=function(){toast('تعذر قراءة الملف')};r.readAsText(f);
};

function jumpItems(){return srcs.filter(function(s){return s.enabled&&s.cnt>0})}
function drawJump(){
  var L=jumpItems(),vis=7,h='';
  ji=Math.max(0,Math.min(ji,L.length-1));
  var st=Math.max(0,Math.min(ji-3,L.length-vis));
  for(var k=st;k<Math.min(L.length,st+vis);k++)h+='<div class="btn'+(k===ji?' sel':'')+'" data-j="'+k+'">'+esc(L[k].name)+' · من '+(L[k].start+1)+' · '+L[k].cnt+' قناة</div>';
  $('jBody').innerHTML=h||'<div class="btn">لا توجد مصادر مفعّلة</div>';
}
function openJump(){
  var L=jumpItems(),p=0;
  for(var i=0;i<L.length;i++)if(L[i].start<=cur)p=i;
  mode='jump';ji=p;$('jmp').classList.remove('hide');drawJump();
}
function openListAt(i){openList();sel=Math.max(0,Math.min(i,view.length-1));drawList()}

/* دعم الفأرة واللمس */
$('rows').onclick=function(e){
  var f=e.target.closest('[data-f]');
  if(f){
    e.stopPropagation();
    var o=view[+f.dataset.f];
    if(o){
      var added=toggleFav(o.c.url);
      toast(added?'تمت الإضافة للمفضلة ★':'تمت الإزالة من المفضلة');
      if(gi===1)applyGroup();
      drawList();
    }
    tm('l',closeAll,12000);return;
  }
  var r=e.target.closest('[data-i]');
  if(r){var o2=view[+r.dataset.i];if(o2)play(o2.i);closeAll()}
};
$('lTabs').onclick=function(e){
  var t=e.target.closest('[data-g]');
  if(t){gi=+t.dataset.g;applyGroup();sel=0;drawList();tm('l',closeAll,12000)}
};
$('sTabs').onclick=function(e){
  var t=e.target.closest('[data-c]');
  if(t){cat=+t.dataset.c;sm='main';si=0;conf=false;drawSet()}
};
$('sBody').onclick=function(e){
  var el=e.target.closest('[data-i]');
  if(el&&curSet){si=+el.dataset.i;var L=curSet.list;if(L[si])L[si].f()}
};
$('jBody').onclick=function(e){
  var el=e.target.closest('[data-j]');
  if(el){var s2=jumpItems()[+el.dataset.j];if(s2){closeAll();openListAt(s2.start)}}
};
function togglePlayInfo(){
  if(mode!=='play')return;
  if(sleepStopped){start();return}
  if($('info').classList.contains('hide'))showInfo();
  else $('info').classList.add('hide');
}
v.onclick=togglePlayInfo;
$('blk').onclick=togglePlayInfo;
$('qList').onclick=function(e){e.stopPropagation();ch.length?openList():openSet()};
$('qJmp').onclick=function(e){e.stopPropagation();openJump()};
$('qSet').onclick=function(e){e.stopPropagation();openSet()};
$('prmCancel').onclick=closeUrlModal;
$('prmOk').onclick=submitUrlModal;

window.onBack=function(){
  if(mode==='url'){closeUrlModal();return true}
  if(numBuf!==''){clearNum();return true}
  if(mode==='set'){backOnce();return true}
  if(mode!=='play'){closeAll();return true}
  return false;
};

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(mode==='url'){
    if(k==='Escape'||k==='GoBack'||(k==='Backspace'&&document.activeElement.tagName!=='INPUT')){closeUrlModal();e.preventDefault();return}
    if(k==='Enter'){submitUrlModal();e.preventDefault();return}
    return;
  }
  if(mode==='set'){
    var stp2=e.repeat?(++hc<6?1:hc<16?5:20):(hc=0,1);
    if(sm==='move'&&(k==='ArrowUp'||k==='ArrowDown')){
      var to=k==='ArrowUp'?Math.max(0,cc-stp2):Math.min(wk.length-1,cc+stp2);
      if(to!==cc){var mc=wk.splice(cc,1)[0];wk.splice(to,0,mc);cc=to;si=cc}
      drawSet();e.preventDefault();return;
    }
    var L=curSet?curSet.list:items().list;
    if(sm==='main'&&(k==='ArrowLeft'||k==='ArrowRight')){
      if(!e.repeat){cat=(cat+(k==='ArrowLeft'?1:5))%6;si=0;conf=false;drawSet()}
      e.preventDefault();return;
    }
    if((sm==='ch'||sm==='grp'||sm==='hid')&&(k==='ArrowLeft'||k==='ArrowRight')){
      si=Math.max(0,Math.min(L.length-1,si+(k==='ArrowLeft'?svis:-svis)));drawSet(true);e.preventDefault();return;
    }
    if(k==='ArrowDown'){si=Math.min(L.length-1,si+stp2);conf=false;drawSet(true);e.preventDefault();return}
    if(k==='ArrowUp'){si=Math.max(0,si-stp2);conf=false;drawSet(true);e.preventDefault();return}
    if(k==='Enter'){if(L[si])L[si].f();e.preventDefault();return}
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){backOnce();e.preventDefault();return}
    drawSet();e.preventDefault();return;
  }
  if(mode==='jump'){
    var JL=jumpItems();
    if(k==='ArrowDown')ji=Math.min(JL.length-1,ji+1);
    else if(k==='ArrowUp')ji=Math.max(0,ji-1);
    else if(k==='Enter'){var s2=JL[ji];if(s2){closeAll();openListAt(s2.start)}e.preventDefault();return}
    else if(k==='Escape'||k==='Backspace'||k==='GoBack'){closeAll();e.preventDefault();return}
    drawJump();e.preventDefault();return;
  }
  if(mode==='list'){
    tm('l',closeAll,12000);
    var vis=Math.max(3,Math.floor(($('rows').clientHeight-12)/52));
    var stp=e.repeat?(++hc<6?1:hc<16?5:20):(hc=0,1);
    if(k==='ArrowDown'){var n2=sel+stp;sel=n2>=view.length?(sel>=view.length-1&&!e.repeat?0:view.length-1):n2}
    else if(k==='ArrowUp'){var n3=sel-stp;sel=n3<0?(sel<=0&&!e.repeat?view.length-1:0):n3}
    else if(k==='ArrowLeft'){gi=(gi+1)%groups.length;applyGroup();sel=0}
    else if(k==='ArrowRight'){gi=(gi-1+groups.length)%groups.length;applyGroup();sel=0}
    else if(k==='PageDown'||k==='ChannelDown')sel=Math.min(Math.max(0,view.length-1),sel+vis);
    else if(k==='PageUp'||k==='ChannelUp')sel=Math.max(0,sel-vis);
    else if(k==='0'||k==='f'||k==='F'||k==='ColorF0Red'){
      var fo=view[sel];
      if(fo){
        var added=toggleFav(fo.c.url);
        toast(added?'تمت الإضافة للمفضلة ★':'تمت الإزالة من المفضلة');
        if(gi===1)applyGroup();
      }
    }
    else if(k==='Enter'){if(view[sel])play(view[sel].i);closeAll();e.preventDefault();return}
    else if(k==='Escape'||k==='Backspace'||k==='GoBack'){closeAll();e.preventDefault();return}
    drawList();e.preventDefault();return;
  }
  /* شاشة التشغيل: أرقام 0-9، ► ×5 = المصادر، ◄ ×5 = الإعدادات */
  if(k>='0'&&k<='9'){
    if(numBuf===''&&k==='0'){
      if(prevCur>=0&&prevCur<ch.length&&prevCur!==cur){play(prevCur);toast('الرجوع للقناة السابقة')}
      else toast('لا توجد قناة سابقة');
      e.preventDefault();return;
    }
    if(numBuf.length<4){numBuf+=k;showNum();tm('num',commitNum,1600)}
    e.preventDefault();return;
  }
  if(numBuf!==''&&k==='Enter'){clearTimeout(T.num);commitNum();e.preventDefault();return}
  if(numBuf!==''&&(k==='Escape'||k==='Backspace'||k==='GoBack')){clearNum();e.preventDefault();return}
  if(k==='ArrowRight'||k==='ArrowLeft'){
    if(!e.repeat){
      if(k!==lk)rc=0;lk=k;rc++;
      tm('rc',function(){rc=0;lk=''},1500);
      if(rc>=5){rc=0;lk='';if(k==='ArrowRight')openJump();else openSet()}
    }
    e.preventDefault();return;
  }
  rc=0;lk='';
  if(k==='ArrowUp'||k==='ChannelUp')play(cur+1);
  else if(k==='ArrowDown'||k==='ChannelDown')play(cur-1);
  else if(k==='Enter'){ch.length?openList():openSet()}
  else return;
  e.preventDefault();
});

loadPrefs();loadFavs();loadSrcs();rebuild();
if(!ch.length){openSet();toast('أضف مصدراً أو فعّل مصدراً')}
else{var lu=P.resume?store('lasturl'):null,li=ch.findIndex(function(c){return c.url===lu});play(li<0?0:li,true)}
})();
</script>
