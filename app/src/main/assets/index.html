:root{--ac:#ffc400;--mu:#9fb4d6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.hide{display:none!important}
#blk{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#blk img{width:84px;height:84px}
#blk b{margin-top:8px;font-size:1rem;color:var(--mu)}
#blk small{font-size:.75rem;color:#5d7396}
#info{z-index:10;position:fixed;left:3%;right:3%;bottom:4%;background:linear-gradient(#123f86,#0b2a5c);border:2px solid #4f7fc9;border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:20px;box-shadow:0 8px 30px #000a}
#iNum{font-size:3rem;font-weight:700;color:var(--ac);min-width:110px;text-align:center}
#iLogo{width:70px;height:70px;object-fit:contain;background:#0006;border-radius:8px}
.meta{flex:1}
#iName{font-size:1.9rem;font-weight:700}
#iGrp{color:var(--mu);margin-top:4px}
#clock{font-size:1.5rem}
.panel{z-index:10;position:fixed;background:linear-gradient(#0b2a5c,#050b1a);border:2px solid #4f7fc9;border-radius:14px;box-shadow:0 10px 40px #000c}
#list{top:5%;bottom:5%;right:3%;width:44%;display:flex;flex-direction:column}
.ph{padding:12px 18px;background:#123f86;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700}
.ph small{color:var(--ac);font-size:.95rem}
#rows{flex:1;min-height:0;overflow:hidden;padding:6px}
.row{height:52px;display:flex;gap:12px;align-items:center;padding:0 14px;border-radius:8px;font-size:1.15rem;white-space:nowrap}
.row .n{color:var(--ac);min-width:52px;text-align:center;font-weight:700}
.row img,.row .lg{width:38px;height:38px;object-fit:contain;flex:none}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.row.sel{background:var(--ac);color:#000}
.row.sel .n{color:#000}
#set{inset:7% 16%}
#sBody{display:flex;flex-direction:column;gap:10px}
.hintS{font-size:.7rem;color:#7f97bf;margin-top:6px;white-space:nowrap}
#set .body{padding:22px;display:flex;flex-direction:column;gap:14px}
.btn{background:#0b2a5c;border:3px solid transparent;border-radius:10px;padding:13px 16px;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sel{border-color:var(--ac);background:#123f86}
#sInf{color:var(--mu);line-height:1.9;font-size:1rem;margin-top:6px}
#sInf a{direction:ltr;unicode-bidi:embed;color:#fff}
#toast{z-index:20;position:fixed;top:45%;left:50%;transform:translateX(-50%);background:#000c;border:2px solid var(--ac);padding:16px 30px;border-radius:12px;font-size:1.5rem;text-align:center}
</style>

}
function applyGroup(){
  var g=groups[gi];
  view=ch.map(function(c,i){return{c:c,i:i}}).filter(function(o){return gi===0||o.c.group===g});
  $('lGrp').textContent=g+' ('+view.length+')';
}
function play(i){
  if(!ch.length)return;
  cur=(i+ch.length)%ch.length;var c=ch[cur];
  $('blk').classList.remove('hide');
  if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|hls/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal)toast('تعذر تشغيل القناة')});
  }else v.src=c.url;
  v.play().catch(function(){});
  store('lasturl',c.url);showInfo();
}
v.addEventListener('playing',function(){$('blk').classList.add('hide')});
v.addEventListener('error',function(){toast('تعذر تشغيل القناة')});
function showInfo(){
  var c=ch[cur];if(!c)return;
  $('iNum').textContent=cur+1;$('iName').textContent=c.name;$('iGrp').textContent=c.group;
  var l=$('iLogo');if(c.logo){l.src=c.logo;l.style.visibility='visible'}else l.style.visibility='hidden';
  $('info').classList.remove('hide');tm('i',function(){$('info').classList.add('hide')},4000);
}
setInterval(function(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)},1000);

/* list: يحسب عدد الأسطر من ارتفاع اللوحة الفعلي فتظهر القناة الأخيرة دائماً */
function drawList(){
  var R=$('rows'),vis=Math.max(3,Math.floor((R.clientHeight-12)/52)),
      st=Math.max(0,Math.min(sel-Math.floor(vis/2),view.length-vis)),h='';
  for(var k=st;k<Math.min(view.length,st+vis);k++){
    var o=view[k];
    h+='<div class="row'+(k===sel?' sel':'')+'"><span class="n">'+(o.i+1)+'</span>'+
       (o.c.logo?'<img src="'+esc(o.c.logo)+'" onerror="this.style.visibility=\'hidden\'">':'<span class="lg"></span>')+
       '<span class="t">'+esc(o.c.name)+'</span></div>';
  }
  R.innerHTML=h;
}
function openList(){
  mode='list';gi=0;applyGroup();
  var p=view.findIndex(function(o){return o.i===cur});sel=p<0?0:p;
  $('list').classList.remove('hide');drawList();tm('l',closeAll,12000);
}
function closeAll(){mode='play';$('list').classList.add('hide');$('set').classList.add('hide')}

/* settings: مصادر متعددة */
var srcs=[],sm='main',cf=0,conf=false;
function saveSrcs(){store('srcs',JSON.stringify(srcs.map(function(s){return{id:s.id,name:s.name,enabled:s.enabled,text:s.text}})))}
function loadSrcs(){
  try{srcs=JSON.parse(store('srcs')||'null')}catch(e){srcs=null}
  if(!Array.isArray(srcs)){
    var old=store('m3u');
    srcs=old?[{id:1,name:'قائمتي',enabled:true,text:old}]:[{id:0,name:'MBC (افتراضي)',enabled:true,text:M3U}];
    saveSrcs();
  }
}
function rebuild(){
  var seen={},all=[];
  srcs.forEach(function(s){
    var a=parse(s.text);s.n=a.length;
    if(s.enabled)a.forEach(function(c){if(!seen[c.url]){seen[c.url]=1;all.push(c)}});
  });
  setChannels(all);
}
function keep(){
  var u=ch[cur]&&ch[cur].url;rebuild();
  var i=ch.findIndex(function(c){return c.url===u});
  if(i>=0)cur=i;
  else if(ch.length)play(0);
  else{if(hls){hls.destroy();hls=null}v.pause();$('blk').classList.remove('hide')}
}
function commit(sel){saveSrcs();keep();sm='main';si=Math.max(0,sel);conf=false;drawSet()}
function openUrl(u){try{if(window.Android&&Android.openUrl)Android.openUrl(u);else window.open(u,'_blank')}catch(e){toast('تعذر فتح الرابط')}}
function back(){
  if(sm==='src'){sm='main';si=cf;conf=false}
  else if(sm==='about'){sm='main';si=items().list.length-2}
  else{closeAll();return}
  drawSet();
}
function items(){
  var it=[],s;
  if(sm==='main'){
    srcs.forEach(function(s,i){it.push({t:(i+1)+'. '+(s.enabled?'✔ ':'⛔ ')+s.name+' · '+s.n+' قناة',f:function(){cf=i;sm='src';si=0;conf=false;drawSet()}})});
    it.push({t:'➕ إضافة مصدر (ملف M3U / TXT)',f:function(){$('file').click()}});
    if(!srcs.some(function(x){return x.id===0}))it.push({t:'↺ استرجاع مصدر MBC الافتراضي',f:function(){srcs.push({id:0,name:'MBC (افتراضي)',enabled:true,text:M3U});saveSrcs();keep();drawSet()}});
    it.push({t:'ℹ حول التطبيق',f:function(){sm='about';si=0;drawSet()}});
    it.push({t:'✖ إغلاق',f:closeAll});
    return{title:'الإعدادات',list:it};
  }
  if(sm==='src'){
    s=srcs[cf];
    it.push({t:s.enabled?'⛔ إيقاف المصدر':'✔ تفعيل المصدر',f:function(){s.enabled=!s.enabled;commit(cf)}});
    if(cf>0)it.push({t:'▲ تحريك للأعلى',f:function(){srcs.splice(cf,1);srcs.splice(cf-1,0,s);commit(cf-1)}});
    if(cf<srcs.length-1)it.push({t:'▼ تحريك للأسفل',f:function(){srcs.splice(cf,1);srcs.splice(cf+1,0,s);commit(cf+1)}});
    it.push({t:conf?'⚠ اضغط OK مرة أخرى للتأكيد':'🗑 حذف المصدر',f:function(){if(!conf){conf=true;drawSet();return}srcs.splice(cf,1);commit(Math.min(cf,srcs.length-1))}});
    it.push({t:'↩ رجوع',f:back});
    return{title:s.name,list:it};
  }
  it.push({t:'وصلة TV · dimo',f:function(){}});
  it.push({t:'🌐 https://wasslatv.blogspot.com/',f:function(){openUrl('https://wasslatv.blogspot.com/')}});
  it.push({t:'🌐 https://dzfastlink.blogspot.com/',f:function(){openUrl('https://dzfastlink.blogspot.com/')}});
  it.push({t:'↩ رجوع',f:back});
  return{title:'حول التطبيق',list:it};
}
function drawSet(){
  var o=items(),L=o.list,vis=7,h='';
  si=Math.max(0,Math.min(si,L.length-1));
  var st=Math.max(0,Math.min(si-3,L.length-vis));
  for(var k=st;k<Math.min(L.length,st+vis);k++)h+='<div class="btn'+(k===si?' sel':'')+'">'+esc(L[k].t)+'</div>';
  $('sT').textContent=o.title;$('sBody').innerHTML=h;
  $('sInf').innerHTML=sm==='main'?'القنوات المفعّلة: '+ch.length+' · ترتيب المصادر = ترقيم القنوات':'';
}
function openSet(){mode='set';sm='main';si=0;conf=false;$('set').classList.remove('hide');drawSet()}
$('file').onchange=function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var a=parse(r.result);
    if(!a.length){toast('الملف لا يحتوي على قنوات');return}
    srcs.push({id:Date.now(),name:f.name.replace(/\.[^.]+$/,''),enabled:true,text:r.result});
    saveSrcs();keep();sm='main';si=srcs.length-1;drawSet();toast('تمت إضافة '+a.length+' قناة');
  };
  r.onerror=function(){toast('تعذر قراءة الملف')};r.readAsText(f);
};

window.onBack=function(){if(mode==='set'){back();return true}if(mode!=='play'){closeAll();return true}return false};

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(mode==='set'){
    var L=items().list;
    if(k==='ArrowDown'){si=Math.min(L.length-1,si+1);conf=false}
    else if(k==='ArrowUp'){si=Math.max(0,si-1);conf=false}
    else if(k==='Enter'){L[si].f();e.preventDefault();return}
    else if(k==='Escape'||k==='Backspace'||k==='GoBack'){back();e.preventDefault();return}
    drawSet();e.preventDefault();return;
  }
  if(mode==='list'){
    tm('l',closeAll,12000);
    if(k==='ArrowDown')sel=Math.min(view.length-1,sel+1);
    else if(k==='ArrowUp')sel=Math.max(0,sel-1);
    else if(k==='ArrowLeft'){gi=(gi+1)%groups.length;applyGroup();sel=0}
    else if(k==='ArrowRight'){gi=(gi-1+groups.length)%groups.length;applyGroup();sel=0}
    else if(k==='Enter'){if(view[sel])play(view[sel].i);closeAll();e.preventDefault();return}
    else if(k==='Escape'||k==='Backspace'||k==='GoBack'){closeAll()}
    drawList();e.preventDefault();return;
  }
  /* شاشة التشغيل: ► خمس مرات متتالية = الإعدادات */
  if(k==='ArrowRight'){
    if(!e.repeat){rc++;tm('rc',function(){rc=0},1500);if(rc>=5){rc=0;openSet()}}
    e.preventDefault();return;
  }
  rc=0;
  if(k==='ArrowUp'||k==='ChannelUp')play(cur+1);
  else if(k==='ArrowDown'||k==='ChannelDown')play(cur-1);
  else if(k==='Enter'){ch.length?openList():openSet()}
  else return;
  e.preventDefault();
});

loadSrcs();rebuild();
if(!ch.length){openSet();toast('أضف مصدراً أو فعّل مصدراً')}
else{var lu=store('lasturl'),li=ch.findIndex(function(c){return c.url===lu});play(li<0?0:li)}
})();
</script>
</body>
</html>
